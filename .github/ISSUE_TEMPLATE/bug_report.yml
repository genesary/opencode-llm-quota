name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste tokens or the contents of `auth.json`.
        For security issues, see [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the plugin with ...
        2. Select the model ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Run with `OPENCODE_QUOTA_LOG=debug OPENCODE_QUOTA_LOG_FILE=/tmp/quota.log`
        (on OpenCode v2, set them in the service environment and run `opencode service restart`)
        and paste the relevant `[quota]` lines. They never contain the token.
      render: shell
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OpenCode version, opencode-keycloak-auth version, OS.
      placeholder: "opencode 2.3.2, opencode-keycloak-auth 1.0.0, macOS 15"
    validations:
      required: true
